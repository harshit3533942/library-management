<!DOCTYPE html>
<html>

<head>
<title>Pay Fine</title>
<link rel="stylesheet" href="../css/style.css">

<script>

function validateFine(){

let fine=document.getElementById("fine").value
let paid=document.getElementById("paid").checked

if(fine>0 && !paid){

document.getElementById("error").innerText=
"Please confirm fine payment"

return false
}

}

</script>

</head>

<body onload="calculateFine()">

<div class="nav">
<a href="../dashboard.html">Dashboard</a>
</div>

<div class="container">

<h2>Fine Payment</h2>

<p id="error" style="color:red"></p>

<form onsubmit="return validateFine()">

<label>Book Name</label>
<input type="text" value="Python Basics" readonly>

<label>Issue Date</label>
<input type="date" id="issueDate" value="2026-03-01" readonly>

<label>Return Date</label>
<input type="date" id="returnDate" value="2026-03-19" readonly>

<label>Fine Amount</label>
<input type="text" id="fine" readonly>

<label>Fine Paid</label>
<input type="checkbox" id="paid">

<label>Remarks</label>
<textarea></textarea>

<button type="submit">Confirm Payment</button>

</form>

</div>
<script src="../js/script.js"></script>
</body>

</html>
